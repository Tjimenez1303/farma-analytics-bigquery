# Checks run on every commit and in CI (same command as `make lint`).
minimum_pre_commit_version: "4.4.0"
exclude: ^tests/fixtures/

repos:
  - repo: local
    hooks:
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: .venv/bin/sqlfluff lint
        language: unsupported
        files: \.sql$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key

  - repo: local
    hooks:
      - id: forbid-credential-files
        name: forbid credential files
        entry: No se pueden versionar archivos de credenciales ni .env. Quita el archivo del commit.
        language: fail
        files: (^|/)(\.env(\.(?!example$)[^/]*)?|\.df-credentials\.json|application_default_credentials\.json|[^/]*service-account[^/]*\.json|[^/]*-key\.json|[^/]*\.p12)$
